server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same shape as vite.config.js's dev proxy: forward /api to the backend
    # container by its docker-compose service name.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off; # keep SSE streaming (Ask) responsive, not buffered
    }

    location / {
        try_files $uri /index.html;
    }
}
